<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feria Empresarial - Catálogo</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <!-- Barra de Navegación -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand">
                <span>Feria Empresarial</span>
            </a>
            <ul class="nav-links" id="nav-links">
                <!-- Se llena con api.js -->
            </ul>
        </div>
    </header>

    <!-- Hero / Bienvenida -->
    <section class="hero">
        <h1>Feria Empresarial</h1>
        <p>Explora y apoya el talento local. Descubre una variedad única de productos y servicios creados con pasión.</p>
    </section>

    <!-- Contenido Principal -->
    <main class="container">
        <!-- Barra de Búsqueda y Filtros -->
        <div class="filter-bar">
            <input type="text" id="buscador" class="search-input" placeholder="🔍 Buscar por nombre o descripción...">
            <select id="filtro-categoria" class="category-select">
                <option value="">Todas las categorías</option>
                <option value="Gastronomía">Gastronomía</option>
                <option value="Artesanías">Artesanías</option>
                <option value="Moda y Calzado">Moda y Calzado</option>
                <option value="Tecnología">Tecnología</option>
                <option value="Servicios">Servicios</option>
                <option value="Belleza y Cuidado Personal">Belleza y Cuidado Personal</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div id="contenedor-estado"></div>

        <!-- Cuadrícula de Emprendimientos -->
        <div class="grid-cards" id="contenedor-emprendimientos">
            <!-- Renderizado dinámico -->
        </div>
    </main>

    <!-- Modal para Detalle y Productos (Solo Lectura para Clientes) -->
    <div class="modal-overlay" id="modal-detalle">
        <div class="modal modal-large">
            <button class="modal-close" onclick="cerrarModal()">&times;</button>
            <div id="modal-contenido">
                <!-- Información del Emprendimiento y sus productos -->
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Feria de Emprendimiento. Todos los derechos reservados.</p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
