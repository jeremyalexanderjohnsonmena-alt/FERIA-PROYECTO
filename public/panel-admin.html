<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Feria Empresarial</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand">
                <span>Feria Empresarial</span> <span style="font-size:0.8rem; background: rgba(79,70,229,0.1); color: var(--primary); padding: 0.15rem 0.5rem; border-radius: 6px; -webkit-text-fill-color: initial; vertical-align: middle;">Admin</span>
            </a>
            <ul class="nav-links" id="nav-links">
                <!-- api.js -->
            </ul>
        </div>
    </header>

    <main class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 1.8rem; color:var(--dark);">Gestión de Emprendimientos</h1>
                <p style="color:var(--text-muted);">Revisa solicitudes de inscripción, avala o rechaza postulaciones.</p>
            </div>
            <button class="btn btn-outline" onclick="cargarTodosLosEmprendimientos()">🔄 Actualizar Lista</button>
        </div>

        <div id="alerta-admin"></div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Emprendimiento</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Estado Actual</th>
                        <th style="text-align: right;">Acciones de Aval</th>
                    </tr>
                </thead>
                <tbody id="tabla-emprendimientos-body">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = authStorage.getUsuario();
            if (!usuario || usuario.rol !== 'administrador') {
                alert('Acceso restringido. Esta sección es exclusiva para administradores.');
                window.location.href = '/login.html';
                return;
            }

            renderNavbar();
            cargarTodosLosEmprendimientos();
        });

        async function cargarTodosLosEmprendimientos() {
            const tbody = document.getElementById('tabla-emprendimientos-body');
            const alerta = document.getElementById('alerta-admin');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:2rem; color:var(--text-muted);">Cargando registros...</td></tr>';
            alerta.innerHTML = '';

            try {
                const res = await api.listarTodosEmprendimientos();
                const lista = res.datos || [];

                if (lista.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:2rem; color:var(--text-muted);">No hay emprendimientos registrados en el sistema.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                lista.forEach(item => {
                    const estado = item.estado_aval || 'pendiente';
                    let badgeClass = 'badge-pendiente';
                    if (estado === 'aprobado') badgeClass = 'badge-aprobado';
                    if (estado === 'rechazado') badgeClass = 'badge-rechazado';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <strong>${item.nombre_emprendimiento}</strong>
                        </td>
                        <td><span class="badge badge-category">${item.categoria}</span></td>
                        <td style="max-width: 320px; font-size: 0.85rem; color:var(--text-muted);">${item.descripcion || 'Sin descripción'}</td>
                        <td><span class="badge ${badgeClass}">${estado.toUpperCase()}</span></td>
                        <td style="text-align: right; white-space: nowrap;">
                            ${estado !== 'aprobado' ? `
                                <button class="btn btn-success btn-sm" onclick="cambiarAval('${item.id}', 'aprobado')">Aprobar / Avalar</button>
                            ` : ''}
                            ${estado !== 'rechazado' ? `
                                <button class="btn btn-outline btn-sm" onclick="cambiarAval('${item.id}', 'rechazado')">Rechazar</button>
                            ` : ''}
                            <button class="btn btn-danger btn-sm" onclick="eliminarEmprendimiento('${item.id}')">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                alerta.innerHTML = `<div class="alert alert-error">Error al cargar: ${err.message}</div>`;
            }
        }

        async function cambiarAval(id, nuevoEstado) {
            if (!confirm(`¿Confirmas cambiar el estado del emprendimiento a "${nuevoEstado.toUpperCase()}"?`)) return;
            try {
                await api.avalarEmprendimiento(id, nuevoEstado);
                cargarTodosLosEmprendimientos();
            } catch (err) {
                alert('Error al actualizar estado: ' + err.message);
            }
        }

        async function eliminarEmprendimiento(id) {
            if (!confirm('¿Seguro que deseas eliminar definitivamente este emprendimiento? Esta acción no se puede deshacer.')) return;
            try {
                await api.eliminarEmprendimiento(id);
                cargarTodosLosEmprendimientos();
            } catch (err) {
                alert('Error al eliminar: ' + err.message);
            }
        }
    </script>
</body>
</html>
